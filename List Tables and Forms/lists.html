<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List - HTML Tutorial</title>
</head>
<body>
    <h1>Lists in HTML</h1>
    <!-- Ordered List  -->
     <h2>Steps to Bake a Cake</h2>
     <ol>
        <li>take the req utensils</li>
        <li>Take required material</li>
        <li>watch the receipe</li>
     </ol>

     <h2>Groceries to Buy</h2>
     <!-- unordered list  -->
      <ul>
        <li>Shoes</li>
        <li>Shirts</li>
        <li>Pants</li>
      </ul>

      <h2>Programming Languages</h2>
      <dl>
        <dt>Python</dt>
        <dd>Hehe this is a High Level Language</dd>

        <dt>C++</dt>
        <dd>Its a modified version of C</dd>
      </dl>
</body>
</html>
