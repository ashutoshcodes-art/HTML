<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Scoreboard</title>
    <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }

    body{
        background:linear-gradient(135deg,#1e3c72,#2a5298);
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        padding:20px;
    }

    img{
        width:120px;
        height:120px;
        object-fit:cover;
        border-radius:50%;
        border:4px solid #ffffff;
        margin-bottom:15px;
        box-shadow:0 6px 15px rgba(0,0,0,0.3);
    }

    h2{
        color:#fff;
        margin-bottom:20px;
        font-size:32px;
        letter-spacing:1px;
    }

    table{
        width:600px;
        border-collapse:collapse;
        background:#fff;
        border-radius:12px;
        overflow:hidden;
        box-shadow:0 10px 25px rgba(0,0,0,0.3);
    }

    thead{
        background:#0077b6;
        color:#fff;
    }

    th,
    td{
        padding:15px;
        text-align:center;
        border:1px solid #ddd;
    }

    tbody tr:nth-child(even){
        background:#f8f9fa;
    }

    tbody tr:hover{
        background:#d6ecff;
        transition:0.3s;
    }

    th{
        font-weight:bold;
    }
</style>
</head>
<body>
    <img src="/Images/bcci.png" alt="234">
    <h2>ScoreBoard</h2>
    <table border="1">
        <thead>
            <tr>
                <th>S.no</th>
                <th>Player Name</th>
                <th>Runs</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>1</th>
                <th>Virat Kohli</th>
                <th>76</th>
            </tr>
            <tr>
                <th>2</th>
                <th>MS Dhoni</th>
                <th>50</th>
            </tr>
            <tr>
                <th>3</th>
                <th>Hardik Pandeya</th>
                <th>87</th>
            </tr>
        </tbody>
    </table>
</body>
</html>
